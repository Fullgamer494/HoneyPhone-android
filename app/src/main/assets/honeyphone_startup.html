<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    svg { display: block; width: 100%; height: 100%; }

    /* The central spin uses the SVG coordinate origin set by the script below. */
    #abyss-twist { opacity: 1; }

    .ring-outer {
      transform-origin: 0 0;
      animation: outerFlow 4.8s ease-in-out 1 both;
    }
    .ring-mid {
      transform-origin: 0 0;
      animation: midFlow 4.8s ease-in-out 1 both;
    }
    .ring-inner {
      transform-origin: 0 0;
      animation: innerFlow 4.8s ease-in-out 1 both;
    }

    @keyframes outerFlow {
      0%, 100% { transform: translateX(0) scale(1, 1); opacity: 1; }
      24% { transform: translateX(-12px) scale(.98, 1.02); opacity: 1; }
      49% { transform: translateX(20px) scale(1.10, .95); opacity: 1; }
      68% { transform: translateX(32px) scale(1.16, .91); opacity: .94; }
      84% { transform: translateX(-8px) scale(1.03, 1.01); opacity: 1; }
    }

    @keyframes midFlow {
      0%, 100% { transform: translateX(0) scale(1, 1); opacity: 1; }
      27% { transform: translateX(10px) scale(1.02, .99); opacity: 1; }
      52% { transform: translateX(-18px) scale(1.11, .94); opacity: 1; }
      72% { transform: translateX(-25px) scale(1.18, .90); opacity: .95; }
      87% { transform: translateX(7px) scale(1.02, 1.01); opacity: 1; }
    }

    @keyframes innerFlow {
      0%, 100% { transform: translateX(0) scale(1, 1); opacity: 1; }
      30% { transform: translateX(-8px) scale(.99, 1.02); opacity: 1; }
      56% { transform: translateX(14px) scale(1.13, .93); opacity: 1; }
      76% { transform: translateX(22px) scale(1.22, .88); opacity: .96; }
      90% { transform: translateX(-5px) scale(1.01, 1.01); opacity: 1; }
    }
  </style>

<script>
(() => {
  const root = document.getElementById("startup-animation");
  const sizeRoot = () => {
    const width = window.innerWidth;
    const height = window.innerHeight;
    document.documentElement.style.width = `${width}px`;
    document.documentElement.style.height = `${height}px`;
    document.body.style.width = `${width}px`;
    document.body.style.height = `${height}px`;
    root.setAttribute("width", `${width}px`);
    root.setAttribute("height", `${height}px`);
    root.style.position = "fixed";
    root.style.left = "0";
    root.style.top = "0";
    root.style.width = `${width}px`;
    root.style.height = `${height}px`;
  };
  sizeRoot();
  window.addEventListener("resize", sizeRoot);
  const visual = document.getElementById("abyss-visual");
  const points = [
    [0, -12, 0.86], [12, -5, 0.94], [38, 12, 1.12], [60, 30, 1.34],
    [73, 40, 1.4], [84, 24, 1.22], [94, 5, 0.9], [100, 0, 1.0],
  ];
  const duration = 4800;
  const start = performance.now();
  const ease = (t) => t * t * (3 - 2 * t);
  function draw(now) {
    const progress = Math.min(100, ((now - start) / duration) * 100);
    let index = 0;
    while (index < points.length - 2 && progress > points[index + 1][0]) index++;
    const from = points[index];
    const to = points[index + 1];
    const part = ease((progress - from[0]) / (to[0] - from[0]));
    const angle = from[1] + (to[1] - from[1]) * part;
    const scale = from[2] + (to[2] - from[2]) * part;
    visual.setAttribute("transform", `rotate(${angle.toFixed(3)} 0 0) scale(${scale.toFixed(4)})`);
    if (progress < 100) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
