<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    body { display:grid; place-items:center; }
    #trap { width:100%; height:100%; display:grid; place-items:center; }
    svg { display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="trap"><!-- HONEYPOT_SVG --></div>
  <script>
    (function () {
      const trap = document.querySelector('svg');
      let lastEventId = null;
      let eventTimer = null;
      window.honeyphoneSetState = function (listening, eventId, animateEvent) {
        trap.classList.toggle('is-closed', !listening);
        const changed = eventId !== lastEventId;
        lastEventId = eventId;
        if (eventTimer) window.clearTimeout(eventTimer);
        if (listening && animateEvent && changed) {
          trap.classList.remove('is-event');
          void trap.getBoundingClientRect();
          trap.classList.add('is-event');
          eventTimer = window.setTimeout(function () {
            trap.classList.remove('is-event');
            eventTimer = null;
          }, 24100);
        } else if (!listening) {
          trap.classList.remove('is-event');
        }
      };
    })();
  </script>
</body>
</html>
