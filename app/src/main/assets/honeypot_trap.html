  <title>HoneyPhone — Venus Flytrap Halftone Animation</title>
  <style>
    #trap-back-lobe, #trap-front-belly, #trap-front-teeth {
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    #trap-back-lobe { transform-origin: 0px 38px; }
    #trap-front-belly { transform-origin: 0px 38px; }
    #trap-front-teeth { transform-origin: 0px -115px; }
    svg.is-closed #trap-back-lobe { transform: scale(0.988, 0.785); }
    svg.is-closed #trap-front-belly { transform: translate(14px, 0px) rotate(3deg) scale(0.96, 1.55); }
    svg.is-closed #trap-front-teeth { transform: translate(20px, -84px) rotate(3.2deg) scale(0.96, 0.90); }
    svg.is-snapping #trap-back-lobe { animation: snap-back 1300ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    svg.is-snapping #trap-front-belly { animation: snap-belly 1300ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    svg.is-snapping #trap-front-teeth { animation: snap-teeth 1300ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes snap-back {
      0%, 100% { transform: scale(1, 1); }
      20% { transform: scale(0.985, 0.77); }
      40% { transform: scale(0.988, 0.785); }
      70% { transform: scale(0.988, 0.785); }
    }
    @keyframes snap-belly {
      0%, 100% { transform: translate(0, 0) rotate(0) scale(1, 1); }
      20% { transform: translate(15px, 0) rotate(3.2deg) scale(0.955, 1.59); }
      40%, 70% { transform: translate(14px, 0) rotate(3deg) scale(0.96, 1.55); }
    }
    @keyframes snap-teeth {
      0%, 100% { transform: translate(0, 0) rotate(0) scale(1, 1); }
      20% { transform: translate(22px, -90px) rotate(3.5deg) scale(0.955, 0.89); }
      40%, 70% { transform: translate(20px, -84px) rotate(3.2deg) scale(0.96, 0.90); }
    }
    #captured-insect { opacity: 0; transform-box: fill-box; transform-origin: center; }
    svg.is-snapping #captured-insect { animation: insect-caught 1300ms ease-out both; }
    @keyframes insect-caught {
      0%, 8% { opacity: 0; transform: translate(-24px, -42px) scale(0.45); }
      18% { opacity: 1; transform: translate(-8px, -16px) scale(1.1); }
      30%, 40% { opacity: 1; transform: translate(0, 0) scale(1); }
      70% { opacity: 0.85; transform: translate(0, 8px) scale(0.78); }
      100% { opacity: 0; transform: translate(0, 18px) scale(0.35); }
    }
  </style>
