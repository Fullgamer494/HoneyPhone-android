<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobación de acceso</title>
<style>:root{color-scheme:dark;--black:#050505;--panel:#101012;--line:#303034;--ink:#f7f7f7;--muted:#a4a4aa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#242426 0,transparent 43%),var(--black);font:15px system-ui,sans-serif;color:var(--ink);position:relative;isolation:isolate}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,#fff .7px,transparent 1px);background-size:7px 7px;mask-image:radial-gradient(ellipse at 50% 0,#000 0,transparent 55%);opacity:.14}main{width:min(100%,420px);border:1px solid #3a3a3e;border-radius:22px;padding:28px;background:#101012ed;backdrop-filter:blur(18px)}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #5c5c62;border-radius:11px;color:var(--ink);font:700 18px monospace;background:radial-gradient(circle,#fff .6px,transparent .9px);background-size:5px 5px;background-color:#111}small{display:block;margin-top:24px;color:#d0d0d3;font:10px monospace;letter-spacing:.14em;text-transform:uppercase}h1{font-size:28px;line-height:1.15;letter-spacing:-.03em}p{color:var(--muted);line-height:1.55}a{display:inline-block;margin-top:14px;color:var(--ink);text-decoration:none;border-bottom:1px solid #85858b;padding-bottom:3px}</style></head>
<body><main><div class="mark">H</div><small>Comprobación de acceso</small><h1>No se pudo validar la sesión</h1><p>Vuelve a la página anterior e inténtalo de nuevo.</p><a href="/">Regresar al acceso →</a></main></body></html>
