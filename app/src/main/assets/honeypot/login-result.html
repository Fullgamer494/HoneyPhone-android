<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobación de acceso</title>
<style>:root{color-scheme:dark;--bg:#07100d;--panel:#101c17;--line:#26362e;--ink:#edf3eb;--muted:#96a79c;--lime:#d4ff33}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#233a24 0,transparent 48%),var(--bg);font:15px system-ui,sans-serif;color:var(--ink)}main{width:min(100%,420px);border:1px solid var(--line);border-radius:24px;padding:28px;background:var(--panel)}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #52623a;border-radius:12px;color:var(--lime);font:700 18px monospace}small{display:block;margin-top:24px;color:var(--lime);font:11px monospace;letter-spacing:.13em;text-transform:uppercase}h1{font-size:28px;line-height:1.15}p{color:var(--muted);line-height:1.55}a{display:inline-block;margin-top:14px;color:var(--lime);text-decoration:none}</style></head>
<body><main><div class="mark">H</div><small>Comprobación de acceso</small><h1>No se pudo validar la sesión</h1><p>Vuelve a la página anterior e inténtalo de nuevo.</p><a href="/">Regresar al acceso →</a></main></body></html>
